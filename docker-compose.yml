# Trading bot stack - Wine-hosted Exness MT5 terminal + the mt5linux
# bridge, the bot process itself, and a read-only dashboard. Isolated from
# every other stack on this VPS (its own directory, its own image names).
# The dashboard is the one thing here reachable publicly, at
# bot.tatuatechnology.com via the shared nginx proxy - see
# deploy/bot.conf and DEPLOY_CONTABO.md - and it requires login (see
# dashboard_server.py) precisely because it's public and shows real
# account data. MT5's own VNC stays 127.0.0.1-only / SSH-tunnel debug
# access, never routed through nginx.
services:
  mt5:
    build:
      context: .
      dockerfile: Dockerfile.mt5
      # `build.shm_size` (not just the top-level one below) - Xvfb crashed
      # mid-build with "XIO: fatal IO error 2" the first time this was
      # tried, which cost the whole layer. The top-level shm_size only
      # applies once the container is actually running; build-time RUN
      # steps get Docker's tiny 64MB default unless it's set here too.
      shm_size: "512m"
    image: trading-bot-mt5:latest
    restart: unless-stopped
    # VNC is debug-only and off unless VNC_PASSWORD is set (see
    # mt5-entrypoint.sh) - bound to 127.0.0.1 here regardless, so even
    # enabled it's never reachable except via an SSH tunnel.
    ports:
      - "127.0.0.1:8801:5900"
    # Wine/X11 apps want more than Docker's tiny 64MB default shm.
    shm_size: "512m"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: trading-bot-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /app/data
      MT5_BRIDGE_HOST: mt5
    volumes:
      - ./data:/app/data
    depends_on:
      - mt5
    # Deliberately idle on deploy - the trading loop is started manually
    # (docker compose exec bot python bo.py) once everything's been
    # verified, not automatically. See DEPLOY_CONTABO.md.
    command: ["sleep", "infinity"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.bot
    image: trading-bot-app:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    # nginx reaches this the same way it reaches every other stack on this
    # VPS - proxy_pass to 127.0.0.1:<port> (see deploy/bot.conf). Not
    # bound to 0.0.0.0, so it's never reachable except through nginx or a
    # local SSH tunnel to this same 127.0.0.1 address.
    ports:
      - "127.0.0.1:8800:5000"
    command: ["python", "dashboard_server.py"]
